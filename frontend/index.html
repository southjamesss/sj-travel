<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>แผนที่ความทรงจำ</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="root">
      <main class="travel-map-page">
        <div class="map-navigation">
          <a class="map-brand" href="#map" aria-label="หน้าแรกแผนที่ความทรงจำ">TM</a>
          <div class="map-crumbs"><strong>ประเทศไทย</strong></div>
          <div class="nav-actions">
            <button class="auth-action-button" type="button">เข้าสู่ระบบ</button>
            <button class="nav-icon-button" type="button" disabled aria-label="กลับ">
              <span aria-hidden="true">&#8592;</span>
            </button>
          </div>
        </div>
        <aside class="memory-preview memory-preview-home">
          <p class="panel-kicker">แผนที่ความทรงจำ</p>
          <h1>ประเทศไทยในความทรงจำ</h1>
          <p class="preview-description">
            แสดงจังหวัดไทยครบ 77 จังหวัด จังหวัดที่เคยไปจะเรืองแสง กด “ตราด” เพื่อซูมเข้าเกาะช้างและดูรูปจากทริป
          </p>
          <div class="preview-stats">
            <span>6 จังหวัดที่เคยไป</span>
            <span>68 รูป</span>
          </div>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
